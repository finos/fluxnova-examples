spring.datasource.url: jdbc:h2:file:./fluxnova-h2-database
spring.datasource.driverClassName: org.h2.Driver
spring.datasource.username: sa
spring.datasource.password: sa
# Uses the Fluxnova provided changelog file to create the database schema and tables.
spring.liquibase.enabled: true
fluxnova:
  bpm:
    test-user-setup:
      enabled: false
    generic-properties:
      properties:
        historyTimeToLive: P1D
    authorization:
      enabled: false
#   Disabling the script-preprocessing plugin intentionally. Refer Plugin documents for more configuration options.
    plugin:
      script-preprocessing:
        enableEnginePlugin: false
        defaultCamundaToFluxnovaPreprocessorEnabled: false
fluxnova.bpm.admin-user:
  id: demo
  password: demo