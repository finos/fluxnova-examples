[server]
root_url = http://localhost:3000

[security]
admin_user = admin
admin_password = fluxnova
disable_initial_admin_password_change = true
allow_embedding = true
cookie_samesite = lax

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[panels]
disable_sanitize_html = true

[auth]
disable_login_form = false

[auth.generic_oauth]
enabled = true
name = Keycloak
icon = signin
allow_sign_up = true
auto_login = false
client_id = grafana
client_secret = grafana-local-secret
scopes = openid profile email groups
auth_url = http://localhost:8180/realms/fluxnova/protocol/openid-connect/auth
token_url = http://localhost:8180/realms/fluxnova/protocol/openid-connect/token
api_url = http://localhost:8180/realms/fluxnova/protocol/openid-connect/userinfo
role_attribute_path = contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'manager') && 'Editor' || 'Viewer'
groups_attribute_path = groups
allowed_groups =
