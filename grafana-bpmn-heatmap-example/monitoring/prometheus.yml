# Prometheus configuration for Fluxnova BPM monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alert-rules.yml'

scrape_configs:
  - job_name: 'fluxnova-exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.containers.internal:9091']
        labels:
          instance: 'fluxnova-local'
    metrics_path: '/metrics'
    scrape_timeout: 5s
